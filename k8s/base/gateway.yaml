# API Gateway (Spring Cloud Gateway). O ingress manda /api para ca; o gateway valida o JWT,
# limita por usuario e repassa ao backend. gateway-canary e uma segunda instancia (0 replicas)
# apontada para backend-canary: o canario desvia trafego no ingress para ela (scripts/canary.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shop
  labels: { app: gateway, track: stable }
spec:
  selector:
    matchLabels: { app: gateway, track: stable }
  template:
    metadata:
      labels: { app: gateway, track: stable }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: gateway, track: stable }
      terminationGracePeriodSeconds: 45
      containers:
        - name: gateway
          image: ghcr.io/example/shop-gateway:latest
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: shop-config }
          env:
            - name: BACKEND_URL
              value: http://backend:8080
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: shop
spec:
  selector: { app: gateway, track: stable }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-canary
  namespace: shop
  labels: { app: gateway, track: canary }
spec:
  replicas: 0
  selector:
    matchLabels: { app: gateway, track: canary }
  template:
    metadata:
      labels: { app: gateway, track: canary }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/example/shop-gateway:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: shop-config }
          env:
            - name: BACKEND_URL
              value: http://backend-canary:8080
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-canary
  namespace: shop
spec:
  selector: { app: gateway, track: canary }
  ports:
    - name: http
      port: 8080
      targetPort: http
