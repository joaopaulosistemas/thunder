# Faixa canario: mesma aplicacao, nova versao, comeca com 0 replicas.
# O script scripts/canary.sh sobe replicas e aumenta o peso no Ingress canario.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: shop
  labels:
    app: backend
    track: canary
spec:
  replicas: 0
  selector:
    matchLabels:
      app: backend
      track: canary
  template:
    metadata:
      labels:
        app: backend
        track: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: backend
          image: ghcr.io/example/shop-backend:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-config
            - secretRef:
                name: shop-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: shop
spec:
  selector:
    app: backend
    track: canary
  ports:
    - port: 8080
      targetPort: 8080
