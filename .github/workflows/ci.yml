name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unitarios + contrato HTTP + arquitetura (ArchUnit) + cobertura (JaCoCo)
      - run: mvn -B verify
      # Analise estatica no SonarQube (so roda se o segredo existir)
      - name: SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=shop-backend
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  services:
    # Versao microsservicos: contratos, infra comum (outbox/inbox) e os 3 servicos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Roda os *Test (surefire) e os *IT com Postgres e Kafka reais (failsafe, precisa de Docker)
      - run: mvn -B verify
      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste-servicos
          path: |
            microservices/services/**/target/surefire-reports
            microservices/services/**/target/failsafe-reports

  web:
    # Shell + microfrontends: build dos 4 apps e teste de Module Federation em Chromium
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: microservices/web/package-lock.json
      - run: npm ci
      - run: npm run build:all
      - name: Module Federation no navegador
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/serve-dist.mjs &
          sleep 3
          npm run test:federation

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tipos gerados do contrato: se alguem editar o openapi.yaml sem regenerar, o CI falha
      - name: Contrato OpenAPI sem drift
        run: |
          npm run gen:api
          git diff --exit-code -- src/app/api/schema.d.ts
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida os overlays do kustomize
        run: |
          kubectl kustomize k8s/overlays/staging > /dev/null
          kubectl kustomize k8s/overlays/production > /dev/null
          kubectl kustomize microservices/k8s/overlays/staging > /dev/null
          kubectl kustomize microservices/k8s/overlays/production > /dev/null
          kubectl kustomize microservices/k8s/overlays/production-secure > /dev/null
      - name: Lint dos scripts e workflows
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint
      - name: Gera e valida os certificados locais (HTTPS do compose)
        run: |
          microservices/infra/tls/gen-certs.sh
          openssl verify -CAfile microservices/infra/tls/certs/ca.crt microservices/infra/tls/certs/server.crt
          shellcheck microservices/infra/tls/gen-certs.sh microservices/infra/vm/render.sh
      - name: Valida o compose
        run: |
          docker compose config -q
          docker compose -f microservices/docker-compose.yml config -q
          # Compose da VM: precisa de DOMAIN e das senhas geradas
          DOMAIN=ci.example.com ACME_EMAIL=ci@example.com microservices/infra/vm/render.sh
          docker compose -f microservices/docker-compose.yml -f microservices/docker-compose.vm.yml \
            --env-file microservices/infra/vm/generated/.env config -q

  e2e:
    needs: [backend, gateway, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sobe a stack (Keycloak, Kafka, Postgres, backend, frontend)
        run: docker compose up -d --build --wait
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color | tail -n 300

  e2e-microservices:
    needs: [services, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Certificados locais
        run: microservices/infra/tls/gen-certs.sh
      - name: Sobe a stack de microsservicos
        run: docker compose -f microservices/docker-compose.yml up -d --build --wait
      - name: Playwright (HTTPS, Keycloak, saga Kafka)
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.ms.config.ts
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f microservices/docker-compose.yml logs --no-color | tail -n 300
