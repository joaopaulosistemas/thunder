name: release

# Depois que o CI passa na main: publica as imagens, sobe em staging automaticamente (+ smoke),
# e so entao pede aprovacao para producao (environment "production" com revisores obrigatorios),
# onde o backend novo entra por canario com rollback guiado pelo SLO.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/shop-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/shop-frontend
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/shop-gateway

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: GIT_SHA=${{ steps.vars.outputs.sha }}
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:${{ steps.vars.outputs.sha }}

  staging:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Sem o segredo do cluster, o deploy e pulado (em vez de falhar o release)
      HAS_KUBE: ${{ secrets.KUBE_CONFIG_STAGING != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - if: env.HAS_KUBE != 'true'
        run: echo '::notice::KUBE_CONFIG_STAGING nao configurado, deploy em staging ignorado'
      - if: env.HAS_KUBE == 'true'
        name: Configura o kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      - if: env.HAS_KUBE == 'true'
        name: Deploy em staging
        run: >
          ./scripts/deploy.sh staging
          ${{ env.BACKEND_IMAGE }}:${{ needs.publish.outputs.sha }}
          ${{ env.FRONTEND_IMAGE }}:${{ needs.publish.outputs.sha }}
          ${{ env.GATEWAY_IMAGE }}:${{ needs.publish.outputs.sha }}
      - if: env.HAS_KUBE == 'true'
        name: Smoke test
        run: ./scripts/smoke.sh shop-staging

  production:
    needs: [publish, staging]
    runs-on: ubuntu-latest
    # Configure em Settings > Environments > production: revisores obrigatorios (aprovacao manual)
    environment: production
    env:
      # Sem o segredo do cluster, o deploy e pulado (em vez de falhar o release)
      HAS_KUBE: ${{ secrets.KUBE_CONFIG != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - if: env.HAS_KUBE != 'true'
        run: echo '::notice::KUBE_CONFIG nao configurado, deploy em production ignorado'
      - if: env.HAS_KUBE == 'true'
        name: Configura o kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      - if: env.HAS_KUBE == 'true'
        name: Config e frontend (backend permanece na versao atual)
        run: >
          ./scripts/deploy.sh production
          ${{ env.BACKEND_IMAGE }}:${{ needs.publish.outputs.sha }}
          ${{ env.FRONTEND_IMAGE }}:${{ needs.publish.outputs.sha }}
          ${{ env.GATEWAY_IMAGE }}:${{ needs.publish.outputs.sha }}
      - if: env.HAS_KUBE == 'true'
        name: Backend por canario (5% > 25% > 50% > 100%, rollback por SLO)
        env:
          PROM_URL: ${{ secrets.PROM_URL }}
        run: ./scripts/canary.sh ${{ env.BACKEND_IMAGE }}:${{ needs.publish.outputs.sha }}
      - if: env.HAS_KUBE == 'true'
        name: Smoke test
        run: ./scripts/smoke.sh shop
