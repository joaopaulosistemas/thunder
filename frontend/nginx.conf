limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # O navegador fala so com este endereco; /api vai para o API Gateway (gateway/), nunca direto
  # ao backend. O limite por IP abaixo e so um escudo grosso; o limite por usuario fica no gateway.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Configuracao em runtime (URL do Keycloak etc.): nunca em cache
  location = /config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Estaticos com hash no nome: cache longo (o papel do CDN em producao)
  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nunca em cache, para o usuario pegar a versao nova apos um deploy
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
