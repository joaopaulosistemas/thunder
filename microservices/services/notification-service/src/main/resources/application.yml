spring:
  application:
    name: notification-service
  config:
    import: classpath:shop-common.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
  kafka:
    consumer:
      group-id: notification-service

server:
  port: 8080

management:
  metrics:
    tags:
      application: notification-service
