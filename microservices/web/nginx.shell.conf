limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: sempre pelo gateway, nunca direto a um microsservico.
  location ^~ /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Cada microfrontend e uma imagem/deploy independente. O shell os serve pelo mesmo dominio
  # (sem CORS) e o manifest de producao aponta para estes caminhos.
  # ^~ e ESSENCIAL: sem ele, a regra de extensao (.js, .css...) mais abaixo vence os prefixos e o nginx procura
  # os chunks do remoto no disco do shell (404). Achado pelo e2e no CI.
  location ^~ /mfe/catalog/       { proxy_pass http://mfe-catalog:80/; }
  location ^~ /mfe/orders/        { proxy_pass http://mfe-orders:80/; }
  location ^~ /mfe/notifications/ { proxy_pass http://mfe-notifications:80/; }

  # Configuracao e descoberta dos remotos: nunca em cache (e o que permite trocar um remoto sem
  # recompilar o shell).
  location ~ ^/(config\.json|federation\.manifest\.json|remoteEntry\.json|importmap\.json)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.(js|css|woff2?|ico|png|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
