# Arquitetura de microsservicos: 3 servicos Spring Boot + Kafka, e shell Angular com 3 microfrontends.
# Suba com:  docker compose -f microservices/docker-compose.yml up --build
# Antes da primeira vez:  microservices/infra/tls/gen-certs.sh   (gera a CA local e o certificado)
# App: https://localhost:8443   Keycloak: https://localhost:8444   Grafana: http://localhost:3000
# (http://localhost:8000 redireciona para https; importe infra/tls/certs/ca.crt no navegador para confiar)
# (usuarios do realm: veja infra/keycloak/shop-realm.json)
name: shop-microservices

x-service-env: &service-env
  AUTH_ISSUER: https://localhost:8444/realms/shop
  AUTH_JWK_SET_URI: http://keycloak:8080/realms/shop/protocol/openid-connect/certs
  AUTH_AUDIENCE: shop-api
  DB_USER: shop
  DB_PASSWORD: shop
  KAFKA_BOOTSTRAP: kafka:9092
  OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

x-service-health: &service-health
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

services:
  # ---------- Borda HTTPS: unico ponto exposto do app (certificado em infra/tls/certs) ----------
  edge:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
      - "8444:8444"
      - "8000:80"
    volumes:
      - ./infra/tls/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls/certs:/etc/nginx/certs:ro
    depends_on:
      - shell
      - keycloak

  # ---------- Frontend: shell + microfrontends (cada um e um deploy independente) ----------
  shell:
    build:
      context: ./web
      args:
        APP: shell
        CONF: nginx.shell.conf
    expose:
      - "80"
    volumes:
      - ./infra/shell-config.https.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - gateway
      - mfe-catalog
      - mfe-orders
      - mfe-notifications
      - keycloak

  mfe-catalog:
    build:
      context: ./web
      args:
        APP: mfe-catalog
        CONF: nginx.remote.conf
    expose:
      - "80"

  mfe-orders:
    build:
      context: ./web
      args:
        APP: mfe-orders
        CONF: nginx.remote.conf
    expose:
      - "80"

  mfe-notifications:
    build:
      context: ./web
      args:
        APP: mfe-notifications
        CONF: nginx.remote.conf
    expose:
      - "80"

  # ---------- Borda: API Gateway (perfil "microservices" roteia para cada servico) ----------
  gateway:
    build: ../gateway
    environment:
      SPRING_PROFILES_ACTIVE: microservices
      AUTH_ISSUER: https://localhost:8444/realms/shop
      AUTH_JWK_SET_URI: http://keycloak:8080/realms/shop/protocol/openid-connect/certs
      AUTH_AUDIENCE: shop-api
      REDIS_HOST: redis
      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    expose:
      - "8080"   # sem porta publicada: so se chega ao gateway pela borda HTTPS (/api)
    healthcheck: *service-health
    depends_on:
      redis: { condition: service_started }
      catalog-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  # ---------- Microsservicos ----------
  catalog-service:
    build:
      context: ./services
      args:
        SERVICE: catalog-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
    expose:
      - "8080"
    healthcheck: *service-health
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  order-service:
    build:
      context: ./services
      args:
        SERVICE: order-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
    expose:
      - "8080"
    healthcheck: *service-health
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  notification-service:
    build:
      context: ./services
      args:
        SERVICE: notification-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications
    expose:
      - "8080"
    healthcheck: *service-health
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  # ---------- Identidade ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://localhost:8444
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded   # o TLS termina na borda; confia em X-Forwarded-*
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../infra/keycloak/shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------- Dados e mensageria ----------
  # Um servidor Postgres com TRES bancos (um por servico). Em producao: um banco gerenciado por servico.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d catalog && pg_isready -U shop -d orders && pg_isready -U shop -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---------- Observabilidade ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - alert-sink

  alert-sink:
    image: mendhak/http-https-echo:35
    environment:
      HTTP_PORT: "8080"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../observability/tempo.yml:/etc/tempo.yml:ro

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
