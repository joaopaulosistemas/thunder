# Borda TLS do Docker Compose: termina o HTTPS e repassa em HTTP para a rede interna.
#   https://localhost:8443  -> shell (que serve os microfrontends e manda /api ao gateway)
#   https://localhost:8444  -> Keycloak
#   http://localhost:8000   -> redireciona para https (301)
# Em Kubernetes quem faz isso e o Ingress + cert-manager (k8s/cert-manager).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Parametros TLS compartilhados pelos dois servidores HTTPS
ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
  listen 80;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://shell:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 8444 ssl;
  http2 on;
  server_name _;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffer_size 16k;          # cookies e tokens do Keycloak passam de 4k
    proxy_buffers 4 16k;
  }
}
