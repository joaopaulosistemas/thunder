# EXEMPLO (AWS Secrets Manager via IRSA). Troque pelo seu provedor: Vault, GCP, Azure Key Vault...
# Pre-requisito: operador External Secrets (CRDs external-secrets.io/v1beta1).
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: shop-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
