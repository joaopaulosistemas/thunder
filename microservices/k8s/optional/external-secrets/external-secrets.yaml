# Os segredos vivem no cofre (nao no git nem no cluster por kubectl create): o External Secrets
# cria e atualiza os Secrets do Kubernetes a partir dele. Um cofre-chave por servico: o order-service
# nao tem a credencial do banco do catalogo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: db-catalog }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: shop-secrets, kind: ClusterSecretStore }
  target: { name: db-catalog }
  data:
    - { secretKey: username, remoteRef: { key: shop/catalog-db, property: username } }
    - { secretKey: password, remoteRef: { key: shop/catalog-db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: db-orders }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: shop-secrets, kind: ClusterSecretStore }
  target: { name: db-orders }
  data:
    - { secretKey: username, remoteRef: { key: shop/orders-db, property: username } }
    - { secretKey: password, remoteRef: { key: shop/orders-db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: db-notifications }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: shop-secrets, kind: ClusterSecretStore }
  target: { name: db-notifications }
  data:
    - { secretKey: username, remoteRef: { key: shop/notifications-db, property: username } }
    - { secretKey: password, remoteRef: { key: shop/notifications-db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: kafka-tls }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: shop-secrets, kind: ClusterSecretStore }
  target: { name: kafka-tls }
  data:
    # truststore.p12 em base64 no cofre; o External Secrets entrega ja decodificado
    - { secretKey: truststore.p12, remoteRef: { key: shop/kafka-tls, property: truststore_p12, decodingStrategy: Base64 } }
    - { secretKey: password, remoteRef: { key: shop/kafka-tls, property: truststore_password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: postgres-tls }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: shop-secrets, kind: ClusterSecretStore }
  target: { name: postgres-tls }
  data:
    - { secretKey: ca.crt, remoteRef: { key: shop/postgres-tls, property: ca_crt } }
