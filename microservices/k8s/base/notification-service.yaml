apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shop
  labels: { app: notification-service }
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: notification-service, track: stable }
  template:
    metadata:
      labels: { app: notification-service, track: stable }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: notification-service }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: notification-service }
      terminationGracePeriodSeconds: 60
      containers:
        - name: notification-service
          image: ghcr.io/example/shop-notification-service:latest
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: shop-config }
          env:
            - name: DB_URL
              value: jdbc:postgresql://notifications-db:5432/notifications
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-notifications, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-notifications, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shop
spec:
  selector: { app: notification-service }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: shop
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notification-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
  namespace: shop
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: notification-service }
