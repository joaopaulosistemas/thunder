apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  # Use servicos gerenciados em producao (Kafka: MSK/Confluent; Redis: ElastiCache/Memorystore).
  KAFKA_BOOTSTRAP: kafka.shop.svc.cluster.local:9092
  KAFKA_TOPIC_REPLICAS: "3"
  REDIS_HOST: redis.shop.svc.cluster.local
  OTEL_TRACES_ENDPOINT: http://tempo.observability.svc.cluster.local:4318/v1/traces
  AUTH_ISSUER: https://auth.example.com/realms/shop
  AUTH_JWK_SET_URI: http://keycloak.auth.svc.cluster.local:8080/realms/shop/protocol/openid-connect/certs
  AUTH_AUDIENCE: shop-api
  TRACING_SAMPLING: "0.1"
  RATE_LIMIT_RPS: "20"
  RATE_LIMIT_BURST: "40"
  CATALOG_URL: http://catalog-service:8080
  ORDERS_URL: http://order-service:8080
  NOTIFICATIONS_URL: http://notification-service:8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: shop
data:
  config.json: |
    {
      "keycloakUrl": "https://auth.example.com",
      "realm": "shop",
      "clientId": "shop-frontend"
    }
