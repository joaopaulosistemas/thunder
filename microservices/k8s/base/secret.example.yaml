# EXEMPLO. Nao aplique assim: crie os segredos reais (ou use External Secrets / Sealed Secrets).
# Um segredo e um banco POR SERVICO: o order-service nao tem credencial do banco do catalogo.
apiVersion: v1
kind: Secret
metadata: { name: db-catalog, namespace: shop }
stringData: { username: catalog_user, password: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: db-orders, namespace: shop }
stringData: { username: orders_user, password: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: db-notifications, namespace: shop }
stringData: { username: notifications_user, password: CHANGE_ME }
