apiVersion: v1
kind: Namespace
metadata:
  name: shop
  annotations:
    # Linkerd injeta o proxy sidecar e cifra (mTLS) todo trafego entre pods. Sem Linkerd instalado a
    # anotacao e inofensiva. Instalacao: ver docs/PASSO-A-PASSO.md (etapa de mTLS).
    linkerd.io/inject: enabled
    # So aceita conexoes autenticadas por mTLS. Exige que o ingress-nginx e o Prometheus tambem estejam
    # na malha (namespaces com linkerd.io/inject: enabled); do contrario o trafego deles e recusado.
    # config.linkerd.io/default-inbound-policy: all-authenticated   <- ative depois de meshar os dois
