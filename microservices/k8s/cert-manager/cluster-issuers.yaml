# Emissores de certificado digital (Let's Encrypt, ACME HTTP-01) para o cert-manager.
# Fica FORA do base porque depende dos CRDs do cert-manager. Instale uma vez:
#   helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set crds.enabled=true
#   kubectl apply -f microservices/k8s/cert-manager/cluster-issuers.yaml
# Troque o e-mail (avisos de expiracao) e o dominio no Ingress. Use primeiro o "staging" (limites
# generosos, certificado nao confiavel pelo navegador) e so depois o "prod".
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
