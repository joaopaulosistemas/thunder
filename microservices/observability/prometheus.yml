global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # job "shop": as regras de SLO e o dashboard agregam os tres servicos
  - job_name: shop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8080"]
        labels: { service: catalog-service }
      - targets: ["order-service:8080"]
        labels: { service: order-service }
      - targets: ["notification-service:8080"]
        labels: { service: notification-service }
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
