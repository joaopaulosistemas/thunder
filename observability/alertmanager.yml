route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: webhook
      repeat_interval: 1h
receivers:
  - name: webhook
    webhook_configs:
      - url: http://alert-sink:8080/
        send_resolved: true
